name: Code checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests, and HTML
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check imports and TypeScript
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Mars Horizon — Junior Astronaut Mission Trainer. Placeholder while the mission trainer is under construction."
    />
    <title>Mars Horizon — Under Construction</title>
    <!-- Inline SVG favicon: avoids a 404 on /favicon.ico with no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d97757'/%3E%3Ccircle cx='11' cy='11' r='3.4' fill='%23b85c40'/%3E%3Ccircle cx='21' cy='20' r='4.6' fill='%23b85c40'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Layer 0/1: deep-space background + pulsing starfield (decorative) -->
    <div id="starfield" class="starfield" aria-hidden="true"></div>

    <!-- Layer 2: the astronaut. Three nested elements, each owning exactly one
         transform, so nothing fights over `transform`:
           .astronaut        translate3d  — position, driven by JS
           .astronaut__deform rotate+scale — squash on impact, driven by JS
           .astronaut__img   sway+breathe  — idle life, driven by CSS
         Also pick-up-able: the pointer handlers live in pointerGrab.ts. -->
    <div id="astronaut" class="astronaut">
      <div id="astronaut-deform" class="astronaut__deform">
        <img id="astronaut-img" class="astronaut__img" alt="Cartoon astronaut floating in space, draggable" />
      </div>
    </div>

    <!-- Layer 3: the message. Sits above the astronaut so the drifting sprite
         passes behind the letters and the text stays legible at all times. -->
    <main class="stage">
      <h1 class="stage__title">
        <span class="stage__title-text">Under Construction</span
        ><span class="stage__cursor" aria-hidden="true">_</span>
      </h1>
    </main>

    <!-- Layer 4: vignette, boosts contrast against the text -->
    <div class="vignette" aria-hidden="true"></div>

    <!-- The main menu. Shown by ui/router.ts; the landing page above keeps
         working behind it and is what BACK TO MAIN MENU returns to. The stage
         images get their src from features/naming/view.ts so Vite fingerprints
         them; data-naming-img only says which file goes in which slot. -->
    <section id="naming" class="naming" aria-labelledby="naming-title">
      <header class="naming__header">
        <div class="naming__brand">
          <span class="naming__brand-mark" aria-hidden="true">&#128640;</span>
          <span class="naming__brand-text">
            <span class="naming__brand-name">MARS HORIZON</span>
            <span class="naming__brand-sub">TRAINER MODE</span>
          </span>
        </div>
        <nav class="naming__nav" aria-label="Primary">Mission Control / Main Menu</nav>
      </header>

      <div class="naming__body">
        <div class="naming__panel">
          <h1 class="naming__title" id="naming-title">Welcome<br />Astronaut</h1>
          <p class="naming__greeting" data-naming-greeting role="status" aria-live="polite"></p>

          <form class="naming__form" data-naming-form novalidate>
            <label class="naming__visually-hidden" for="naming-input">Your astronaut's name</label>
            <input
              class="naming__input"
              id="naming-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="[ Enter name ]"
              data-naming-input
            />
            <p class="naming__hint" data-naming-hint aria-live="polite"></p>
            <div class="naming__actions">
              <button class="naming__button" type="submit" data-naming-submit disabled>
                Start Mission
              </button>
              <button class="naming__button" type="button" data-naming-back>
                Back to Main Menu
              </button>
            </div>
          </form>

          <aside class="naming__trainer">
            <p class="naming__trainer-head">
              <span class="naming__trainer-flag">
                <span aria-hidden="true">&#9673;</span> Trainer Mode
              </span>
              <span class="naming__trainer-state">Active</span>
            </p>
            <p class="naming__trainer-note">
              Learn to become an expert. We support crew-voice guided missions,
              safe bot at all times.
            </p>
          </aside>
        </div>

        <div class="naming__stage">
          <div class="naming__card">
            <img
              class="naming__mars"
              data-naming-img="mars"
              alt=""
              aria-hidden="true"
              decoding="async"
            />
            <img
              class="naming__astronaut"
              data-naming-img="astronaut"
              alt="A cartoon astronaut in a white spacesuit, floating in front of Mars"
              decoding="async"
            />
          </div>
        </div>
      </div>
    </section>

    <!-- The mission briefing. Reached by naming the astronaut and pressing
         START MISSION. No images: the copy is the whole screen. -->
    <section id="briefing" class="briefing" aria-labelledby="briefing-title">
      <header class="briefing__header">
        <div class="briefing__brand">
          <span class="briefing__brand-mark" aria-hidden="true">&#128640;</span>
          <span class="briefing__brand-text">
            <span class="briefing__brand-name">MARS HORIZON</span>
            <span class="briefing__brand-sub">MISSION BRIEFING</span>
          </span>
        </div>
        <nav class="briefing__nav" aria-label="Primary">Mission Control / Main Menu</nav>
      </header>

      <div class="briefing__body">
        <h1 class="briefing__title" id="briefing-title">Mission Briefing</h1>
        <p class="briefing__greeting" data-briefing-greeting role="status"></p>

        <!-- The beats are generated in briefing/view.ts so the copy lives in
             briefing/model.ts, where it is unit tested. -->
        <ol class="briefing__stream" data-briefing-stream></ol>

        <p class="briefing__hint" aria-live="polite"></p>

        <div class="briefing__actions">
          <button class="briefing__button" type="button" data-briefing-skip>
            Skip Briefing
          </button>
          <button class="briefing__button" type="button" data-briefing-continue>
            Continue
          </button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
